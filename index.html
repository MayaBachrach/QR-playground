<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>qArt — מסוף עריכת QR</title>
<style>
  @font-face {
    font-family: "qArt OSD";
    src: url("qart-osd.ttf") format("truetype");
    font-display: swap;
    unicode-range: U+05D0-05EA;
  }
  :root {
    --ink: #FF0088;
    --screen: #000000;
    --osd: "Miriam Fixed", "Courier New", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid;
    grid-template-columns: minmax(0, 1fr); place-items: center;
    background: var(--screen); color: var(--ink);
    font: 1.0625rem/1.4 var(--osd);
    padding: clamp(.55rem, 3vw, 2.5rem);
  }
  .terminal { width: min(100%, 54rem); }
  .stops li + li { border-inline-start: 1px dashed; }
  .stops li:first-child { border-inline-start: 1px solid; }
  .stops li:last-child { border-inline-end: 1px solid; }
  .navigation { margin-bottom: .75rem; border-bottom: 2px dashed; padding-bottom: .35rem; }
  .stops { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin: 0 0 .35em; padding: 0; list-style: none; }
  .stops li { text-align: center; padding-block: .17em; border-block: 1px solid; font-family: "qArt OSD", var(--osd); }
  .stops li::before { content: "◀" / ""; margin-inline-end: .35em; visibility: hidden; }
  .terminal:has(.prompt:focus-within) .stops li:nth-child(1),
  .terminal:has(.matrix:focus-within) .stops li:nth-child(2),
  .terminal:has(.commands:focus-within) .stops li:nth-child(3) {
    background: var(--ink); color: var(--screen); border-color: var(--ink);
  }
  .terminal:has(.prompt:focus-within) .stops li:nth-child(1)::before,
  .terminal:has(.matrix:focus-within) .stops li:nth-child(2)::before,
  .terminal:has(.commands:focus-within) .stops li:nth-child(3)::before { visibility: visible; }
  .tab-help { text-align: center; }
  .mode-help {
    display: grid; text-align: center; min-height: 2.8em; align-items: center;
  }
  .mode-help p { grid-area: 1 / 1; visibility: hidden; }
  .mode-help #paste-help,
  .terminal:has(.matrix:focus-within) #grid-help,
  .terminal:has(.commands:focus-within) #menu-help { visibility: visible; }
  .terminal:has(.matrix:focus-within, .commands:focus-within) #paste-help { visibility: hidden; }
  h1, h2, p, dl, dt, dd { margin: 0; }
  h1 { font-size: clamp(1.3rem, 4vw, 2rem); padding-inline: .2em; white-space: nowrap; }
  h2 { font-size: 1.05em; }
  h1, h2, .action, .status-label { font-family: "qArt OSD", var(--osd); }
  header {
    display: flex; align-items: center; gap: .8rem; margin-bottom: .9rem;
  }
  header::before, header::after { content: ""; flex: 1; border-top: .15em dashed; }
  .prompt {
    display: flex; align-items: baseline; gap: .65em;
    padding: .25em .5em; margin-bottom: 1rem; border: 1px solid;
  }
  .prompt:focus-within { background: var(--ink); color: var(--screen); }
  .prompt label { white-space: nowrap; }
  input {
    background: inherit; color: inherit; caret-color: currentColor;
    outline: none; border: 0; min-width: 0; flex: 1; padding: .15em 0; font: inherit;
  }
  input::selection { background: var(--ink); color: var(--screen); }
  .prompt:focus-within input::selection { background: var(--screen); color: var(--ink); }
  .work { border-block: 1px dashed; padding-block: .6rem; display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(0, 1fr); align-items: start; gap: clamp(1rem, 5vw, 3rem); }
  .commands { min-width: 0; grid-column: 1; grid-row: 1; }
  .menu-heading { display: flex; align-items: center; gap: .55em; margin-bottom: .35em; }
  .menu-heading::after { content: ""; flex: 1; border-top: 1px dashed; }
  .action, .region-choice {
    width: 100%; border: 0; padding: 0; background: var(--screen); color: var(--ink);
    font: inherit; text-align: inherit;
  }
  .action {
    font-family: "qArt OSD", var(--osd); font-size: 1.12em;
    display: flex; align-items: baseline; justify-content: space-between; gap: .4em;
    padding-inline: .35em;
  }
  .action kbd { padding-inline: .25em; border-inline: 1px solid; }
  .action-name::before { content: "◀" / ""; margin-inline-end: .4em; visibility: hidden; }
  .action:focus-visible .action-name::before { visibility: visible; }
  .action:focus-visible, .region-choice:focus-visible {
    outline: 1px solid var(--ink); background: var(--ink); color: var(--screen);
  }
  .region-choice[aria-current="true"] { background: var(--ink); color: var(--screen); }
  .region-choice[aria-current="true"]:focus-visible { outline-offset: 2px; }
  kbd, bdi { font: inherit; }
  .region-readout { border-top: 1px dashed; padding-top: .45em; }
  .slots {
    margin: .2em 0 0; padding: 0; list-style: none;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .3em;
  }
  .slots li { min-width: 0; min-height: 1.4em; white-space: nowrap; text-align: center; border: 1px solid; }
  .matrix { grid-column: 2; grid-row: 1; min-width: 0; justify-self: center; width: min(100%, 50svh, 24rem); }
  .readout {
    display: flex; align-items: baseline; justify-content: space-between; gap: .35em;
    font-size: .85em; margin-bottom: .4em; white-space: nowrap;
  }
  .matrix:focus-within .readout { background: var(--ink); color: var(--screen); }
  #qr { aspect-ratio: 1; outline: 1px solid; outline-offset: 3px; }
  #qr:focus { outline: 2px solid; }
  #qr svg { display: block; width: 100%; height: 100%; }
  .status-line {
    display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .55em;
    margin-top: .45rem;
  }
  .status-label { align-self: start; background: var(--ink); color: var(--screen); padding-inline: .35em; }
  #status { block-size: 2.85em; overflow: auto; overflow-wrap: anywhere; }
  h1, .commands, .readout, .status-line { filter: blur(.25px); }
  @media (max-width: 45rem) {
    .work { grid-template-columns: 1fr; gap: .6rem; }
    .commands { grid-row: 2; }
    .matrix { grid-column: 1; grid-row: 1; width: min(100%, 30svh, 19rem); }
    .work { padding-block: .4rem; }
  }
  @media (max-width: 45rem) and (max-height: 650px) {
    body { font-size: .9375rem; line-height: 1.25; }
    header, .prompt, .navigation { margin-bottom: .4rem; }
    .navigation { padding-bottom: .15rem; }
    .mode-help { min-height: 2.55em; }
    .matrix { width: min(100%, max(8.5rem, 21svh)); }
    .readout { margin-inline: -.4em; }
    #status { block-size: 2.55em; }
  }
</style>
</head>
<body>
<main class="terminal">
  <header><h1>תפריט <bdi>qArt</bdi></h1></header>
  <section class="navigation" aria-label="סדר המעבר במקלדת">
    <ol class="stops"><li>קישור</li><li><bdi>QR</bdi></li><li>תפריט</li></ol>
    <p class="tab-help"><bdi><kbd>TAB</kbd></bdi> לחלק הבא · <bdi><kbd>SHIFT+TAB</kbd></bdi> לחלק הקודם</p>
    <div class="mode-help">
      <p id="paste-help">מדביקים קישור עם <bdi><kbd>Ctrl+V / ⌘+V</kbd></bdi> ואז <bdi><kbd>Enter</kbd></bdi></p>
      <p id="grid-help">החצים מזיזים את הסמן · רווח מסמן או מבטל</p>
      <p id="menu-help"><bdi><kbd>↑ ↓</kbd></bdi> לבחירה · <bdi><kbd>Enter</kbd></bdi> להפעלה · <bdi><kbd>Esc</kbd></bdi> חזרה ל־QR</p>
    </div>
  </section>
  <form id="prompt" class="prompt" dir="ltr">
    <label for="data" dir="rtl">קישור</label>
    <span aria-hidden="true">&gt;</span>
    <input id="data" dir="ltr" type="text" value="https://example.com" spellcheck="false"
           autocomplete="off" aria-keyshortcuts="Control+V Meta+V" aria-describedby="paste-help" autofocus>
  </form>
  <div class="work">
    <section class="matrix">
      <div class="readout"><span>מטריצת עריכה</span><bdi id="position">X: 00 / Y: 00</bdi></div>
      <div id="qr" tabindex="0" role="img" aria-label="מטריצת קוד QR" aria-describedby="grid-help"></div>
    </section>
    <section class="commands" id="commands" aria-label="פקודות מקלדת" aria-describedby="menu-help">
      <h2 class="menu-heading">פקודות מקלדת</h2>
      <button type="button" class="action" data-command="KeyF" tabindex="0"><span class="action-name">חיפוש אזורים</span><kbd>F</kbd></button>
      <div class="region-readout">
        <h2>אזורים מאומתים <bdi>1–3</bdi></h2>
        <ol class="slots" id="regionResults">
          <li><button type="button" class="region-choice" data-command="Digit1" tabindex="-1"></button></li>
          <li><button type="button" class="region-choice" data-command="Digit2" tabindex="-1"></button></li>
          <li><button type="button" class="region-choice" data-command="Digit3" tabindex="-1"></button></li>
        </ol>
      </div>
      <button type="button" class="action" data-command="Delete" tabindex="-1"><span class="action-name">מחיקת האזור הנבחר</span><kbd>DEL</kbd></button>
      <button type="button" class="action" data-command="KeyR" tabindex="-1"><span class="action-name">איפוס שינויים</span><kbd>R</kbd></button>
      <button type="button" class="action" data-command="KeyP" tabindex="-1"><span class="action-name">הורדת <bdi>PNG</bdi></span><kbd>P</kbd></button>
      <button type="button" class="action" data-command="KeyS" tabindex="-1"><span class="action-name">הורדת <bdi>SVG</bdi></span><kbd>S</kbd></button>
    </section>
  </div>
  <div class="status-line"><span class="status-label" aria-hidden="true">מצב</span><p id="status" role="status">המסוף מוכן</p></div>
</main>
<script src="qr-engine.js"></script>
<script src="regions.js"></script>
<script src="app.js"></script>
</body>
</html>
