<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="preload" href="qart-osd.ttf" as="font" type="font/ttf" crossorigin>
<title>qArt — מסוף עריכת QR</title>
<style>
  @font-face {
    font-family: "qArt OSD";
    src: url("qart-osd.ttf") format("truetype");
    font-display: swap;
    unicode-range: U+05D0-05EA;
  }
  :root {
    --ink: #FF0088;
    --screen: #000000;
    --osd: "Miriam Fixed", "Courier New", monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid;
    grid-template-columns: minmax(0, 1fr); place-items: center;
    background: var(--screen); color: var(--ink);
    font: 1.0625rem/1.4 var(--osd);
    padding: clamp(.55rem, 3vw, 2.5rem);
  }
  .terminal { width: min(100%, 54rem); }
  .navigation {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .3em 1em;
    margin-bottom: .65rem; padding-bottom: .45rem; border-bottom: 2px dashed;
  }
  .mode {
    display: grid; min-width: 9ch; text-align: center; padding-inline: .35em;
    background: var(--ink); color: var(--screen); font-family: "qArt OSD", var(--osd);
  }
  .mode span { grid-area: 1 / 1; visibility: hidden; }
  .mode span:first-child,
  .terminal:has(.matrix:focus-within) .mode span:nth-child(2),
  .terminal:has(.commands:focus-within) .mode span:nth-child(3) { visibility: visible; }
  .terminal:has(.matrix:focus-within, .commands:focus-within) .mode span:first-child { visibility: hidden; }
  .local-help { font-size: .9em; }
  #paste-help { margin-bottom: .2rem; }
  #grid-help { margin-top: .45rem; text-align: center; }
  #menu-help { margin-bottom: .45rem; }
  h1, h2, p, dl, dt, dd { margin: 0; }
  h1 { font-size: clamp(1.3rem, 4vw, 2rem); padding-inline: .2em; white-space: nowrap; }
  h2 { font-size: 1.05em; }
  h1, h2, .action, .status-label { font-family: "qArt OSD", var(--osd); }
  header {
    display: flex; align-items: center; gap: .8rem; margin-bottom: .9rem;
  }
  header::before, header::after { content: ""; flex: 1; border-top: .15em dashed; }
  .prompt {
    display: flex; align-items: baseline; gap: .65em;
    padding: .25em .5em; margin-bottom: .6rem; border: 1px solid;
  }
  .prompt:focus-within { background: var(--ink); color: var(--screen); }
  .prompt label { white-space: nowrap; }
  input {
    background: inherit; color: inherit; caret-color: currentColor;
    outline: none; border: 0; min-width: 0; flex: 1; padding: .15em 0; font: inherit;
  }
  input::selection { background: var(--ink); color: var(--screen); }
  .prompt:focus-within input::selection { background: var(--screen); color: var(--ink); }
  .screen { border: 1px solid; padding: clamp(.55rem, 2vw, 1rem); }
  .work { border-block: 1px dashed; padding-block: .6rem; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.18fr); align-items: start; gap: clamp(1rem, 5vw, 3rem); }
  .commands { min-width: 0; grid-column: 2; grid-row: 1; }
  .menu-heading { display: flex; align-items: center; gap: .55em; margin-bottom: .35em; }
  .menu-heading::after { content: ""; flex: 1; border-top: 1px dashed; }
  .action, .region-choice {
    width: 100%; border: 0; padding: 0; background: var(--screen); color: var(--ink);
    font: inherit; text-align: inherit;
  }
  .action {
    font-family: "qArt OSD", var(--osd); font-size: 1.12em;
    display: flex; align-items: baseline; justify-content: space-between; gap: .4em;
    padding-inline: .35em;
  }
  .action kbd { padding-inline: .25em; border-inline: 1px solid; }
  .action-name::before { content: "◀" / ""; margin-inline-end: .4em; visibility: hidden; }
  .action:focus-visible .action-name::before { visibility: visible; }
  .action:focus-visible, .region-choice:focus-visible {
    outline: 1px solid var(--ink); background: var(--ink); color: var(--screen);
  }
  .delete-caption { display: inline-grid; vertical-align: baseline; }
  .delete-caption span { grid-area: 1 / 1; }
  #erase[aria-disabled="true"] .delete-ready,
  #erase[aria-disabled="false"] .delete-wait { visibility: hidden; }
  #erase[aria-disabled="true"] kbd { visibility: hidden; }
  .region-choice[aria-current="true"] { background: var(--ink); color: var(--screen); }
  .region-choice[aria-current="true"]:focus-visible { outline-offset: 2px; }
  kbd, bdi { font: inherit; }
  .region-readout { border-top: 1px dashed; padding-top: .45em; }
  .slots {
    margin: .2em 0 0; padding: 0; list-style: none;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .3em;
  }
  .slots li { min-width: 0; min-height: 1.4em; white-space: nowrap; text-align: center; border: 1px solid; }
  .matrix { grid-column: 1; grid-row: 1; min-width: 0; justify-self: center; width: min(100%, 50svh, 24rem); }
  .readout {
    display: flex; align-items: baseline; justify-content: space-between; gap: .35em;
    font-size: .85em; margin-bottom: .4em; white-space: nowrap;
  }
  .matrix:focus-within .readout { background: var(--ink); color: var(--screen); }
  #qr { aspect-ratio: 1; outline: 1px solid; outline-offset: 3px; }
  #qr:focus { outline: 2px solid; }
  #qr svg { display: block; width: 100%; height: 100%; }
  .status-line {
    display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: .55em;
    margin-top: .45rem;
  }
  .status-label { align-self: start; background: var(--ink); color: var(--screen); padding-inline: .35em; }
  #status { block-size: 2.85em; overflow: auto; overflow-wrap: anywhere; }
  h1, .commands, .readout, .status-line { filter: blur(.25px); }
  @media (max-width: 45rem) {
    .work { grid-template-columns: 1fr; gap: .6rem; }
    .commands { grid-column: 1; grid-row: 2; }
    .matrix { grid-column: 1; grid-row: 1; width: min(100%, 30svh, 19rem); }
    .work { padding-block: .4rem; }
  }
  /* Readable OSD hierarchy and stable, explicit interaction states. */
  body { font-size: 1.125rem; line-height: 1.5; }
  .terminal { width: min(100%, 62rem); }
  .local-help { font-size: 1em; }
  .action { min-height: 2.1em; padding-block: .15em; }
  button { cursor: pointer; }
  button[aria-disabled="true"] { cursor: not-allowed; }
  button[aria-disabled="true"] .action-name::before { content: "×"; visibility: visible; }
  .action:focus .action-name::before { content: "◀"; visibility: visible; }
  .action:focus, .region-choice:focus { outline: 2px solid var(--ink); outline-offset: 2px; background: var(--ink); color: var(--screen); }
  #cell-state { height: 3em; margin-top: .5em; text-align: center; }
  #grid-help { margin-top: 0; }
  .readout { white-space: normal; flex-wrap: wrap; }
  .slots li { min-height: 2em; }
  .region-choice { min-height: 2em; }
  #status { block-size: 3em; }
  .matrix { width: min(100%, 44svh, 24rem); }
  @media (max-width: 45rem) {
    body { font-size: 1.0625rem; place-items: start center; }
    .matrix { width: min(100%, 19rem); }
    .work { gap: 1rem; }
    .navigation { font-size: .95em; }
    .status-line { grid-template-columns: 1fr; }
    .status-label { justify-self: start; }
    #status { block-size: 4.5em; }
  }
  #work-state { min-height: 1.5em; margin-bottom: .3em; }
  .commands:has([aria-disabled="true"]) #work-state { overflow-wrap: anywhere; }
  #qr svg { shape-rendering: crispEdges; }
  .region-choice[aria-disabled="true"] { border-block-end: 1px dashed; }

  .submit { border: 1px solid currentColor; background: inherit; color: inherit; font: inherit; white-space: nowrap; padding: .1em .3em; }
  .touch-pad { display: none; gap: .3rem; margin-top: .7rem; }
  .touch-pad button { min-width: 0; flex: 1; min-height: 44px; border: 1px solid; background: var(--screen); color: var(--ink); font: inherit; }
  .matrix, .action, .region-choice { scroll-margin-block: 1rem; }
  #work-state { height: 1.5em; font-size: .9em; }
  @media (pointer: coarse) { .touch-pad { display: flex; } }
  @media (max-width: 45rem) {
    .prompt { flex-wrap: wrap; gap: .35em; }
    .prompt input { flex-basis: 65%; }
    .submit { margin-inline-start: auto; }
    .mode { min-width: 8ch; }
  }
  @media (min-width: 45.01rem) and (max-height: 700px) {
    body { place-items: start center; padding-block: 1rem; }
    .matrix { width: min(100%, 18rem); }
  }
</style>
</head>
<body>
<main class="terminal">
  <header><h1>תפריט <bdi>qArt</bdi></h1></header>
  <section class="navigation" aria-label="סדר המעבר במקלדת">
    <p class="mode"><span>קישור</span><span>עריכת QR</span><span>תפריט</span></p>
    <p><bdi><kbd>Tab</kbd></bdi>: קישור ← QR ← תפריט · <bdi><kbd>Shift+Tab</kbd></bdi> אחורה</p>
  </section>
  <div class="screen">
  <p class="local-help" id="paste-help">מדביקים קישור ואז <bdi><kbd>Enter</kbd></bdi> לעריכה</p>
  <form id="prompt" class="prompt" dir="ltr">
    <label for="data" dir="rtl">קישור</label>
    <span aria-hidden="true">&gt;</span>
    <input id="data" dir="ltr" type="text" value="https://example.com" spellcheck="false"
           autocomplete="off" aria-keyshortcuts="Control+V Meta+V" aria-describedby="paste-help" autofocus>
    <button type="submit" class="submit" tabindex="-1">יצירה ↵</button>
  </form>
  <div class="work">
    <section class="matrix">
      <div class="readout"><span>מטריצת עריכה</span><bdi id="position">X: 00 / Y: 00</bdi></div>
      <div id="qr" tabindex="0" role="group" aria-roledescription="עורך QR" aria-label="מטריצת קוד QR" aria-describedby="grid-help"></div>
      <div class="touch-pad" aria-label="ניווט במגע">
        <button type="button" data-move="ArrowRight" tabindex="-1" aria-label="ימינה">→</button>
        <button type="button" data-move="ArrowUp" tabindex="-1" aria-label="למעלה">↑</button>
        <button type="button" data-move="toggle" tabindex="-1">שינוי</button>
        <button type="button" data-move="ArrowDown" tabindex="-1" aria-label="למטה">↓</button>
        <button type="button" data-move="ArrowLeft" tabindex="-1" aria-label="שמאלה">←</button>
      </div>
      <p id="cell-state" class="local-help"></p>
      <p class="local-help" id="grid-help">חצים לתנועה · <bdi><kbd>Tab</kbd></bdi> לתפריט · <bdi><kbd>Esc</kbd></bdi> לקישור</p>
    </section>
    <section class="commands" id="commands" aria-label="פקודות מקלדת" aria-describedby="menu-help">
      <h2 class="menu-heading">פקודות מקלדת</h2><p id="work-state" class="local-help">מוכן</p>
      <p class="local-help" id="menu-help"><bdi><kbd>↑ ↓ ← →</kbd></bdi> לבחירה · <bdi><kbd>Enter</kbd></bdi> להפעלה · <bdi><kbd>Esc</kbd></bdi> ל־QR</p>
      <button type="button" class="action" data-command="KeyF" tabindex="0"><span class="action-name">חיפוש אזורים</span><kbd>F</kbd></button>
      <div class="region-readout">
        <h2>אזורים מאומתים <bdi>1–3</bdi></h2>
        <ol class="slots" id="regionResults">
          <li><button type="button" class="region-choice" data-command="Digit1" tabindex="-1"></button></li>
          <li><button type="button" class="region-choice" data-command="Digit2" tabindex="-1"></button></li>
          <li><button type="button" class="region-choice" data-command="Digit3" tabindex="-1"></button></li>
        </ol>
      </div>
      <button id="erase" type="button" class="action" data-command="Delete" aria-disabled="true" tabindex="-1">
        <span class="action-name"><span class="delete-caption"><span class="delete-ready">מחיקת האזור</span><span class="delete-wait">בחרו אזור למחיקה</span></span></span><kbd>DEL</kbd>
      </button>
      <button type="button" class="action" data-command="KeyR" tabindex="-1"><span class="action-name">איפוס שינויים</span><kbd>R</kbd></button>
      <button type="button" class="action" data-command="KeyP" tabindex="-1"><span class="action-name">הורדת <bdi>PNG</bdi></span><kbd>P</kbd></button>
      <button type="button" class="action" data-command="KeyS" tabindex="-1"><span class="action-name">הורדת <bdi>SVG</bdi></span><kbd>S</kbd></button>
    </section>
  </div>
  <div class="status-line"><span class="status-label" aria-hidden="true">מצב</span><p id="status" role="status">המסוף מוכן</p></div>
  </div>
</main>
<script src="qr-engine.js"></script>
<script src="regions.js"></script>
<script src="app.js"></script>
</body>
</html>
