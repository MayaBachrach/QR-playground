<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="qArt — a simple two-color matrix editor.">
<title>qArt — MATRIX EDITOR</title>
<style>
:root{--black:#000000;--green:#39ff14;color-scheme:dark;
  font-family:"Courier New",Courier,monospace;color:var(--green);background:var(--black)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--black)}
button,input,select{font:inherit;border-radius:0}
button{cursor:pointer}
button:disabled,input:disabled,select:disabled{opacity:.65;cursor:wait}
button:focus-visible,input:focus-visible,select:focus-visible,[data-tab]:focus-visible{
  outline:3px solid var(--green);outline-offset:3px}
.terminal{width:100%;height:100dvh;padding:clamp(10px,1.25vw,20px);display:grid;
  grid-template-rows:auto minmax(0,1fr) auto;gap:12px;overflow:hidden;background:var(--black)}
.topbar{min-height:70px;display:flex;align-items:center;justify-content:space-between;
  gap:16px;border:3px solid var(--green);padding:8px 18px}
.brand{display:flex;gap:20px;align-items:center;min-width:0}
.brand h1{font-size:clamp(36px,4vw,64px);line-height:1;margin:0;letter-spacing:-4px;font-weight:900}
.brand .label{font-size:17px;line-height:1.3;font-weight:900}
.hud{font-size:17px;font-weight:900;white-space:nowrap}
.display{min-height:0;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(340px,370px);gap:12px}
.game-screen,.control-panel{min-width:0;min-height:0;border:3px solid var(--green);background:var(--black)}
.game-screen{padding:13px;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;gap:11px}
.section-head{font-size:19px;line-height:1.1;font-weight:900;display:flex;align-items:center;
  justify-content:space-between;gap:10px;padding-bottom:8px;border-bottom:3px solid var(--green)}
.section-head .right{font-size:15px;white-space:nowrap}
.playfield{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;
  border:3px solid var(--green);overflow:hidden}
.qr-rack{width:min(calc(100% - 24px),calc(100dvh - 260px),620px);aspect-ratio:1;
  flex:none;padding:8px;border:4px solid var(--green);background:var(--green)}
#qr{width:100%;height:100%;display:grid;place-items:center;touch-action:manipulation}
#qr svg,#qr canvas{height:100%;width:100%;max-width:100%;max-height:100%;display:block;
  image-rendering:pixelated;shape-rendering:crispEdges}
#qr [data-cell]{cursor:crosshair}
#qr [data-cell]:focus{outline:none;stroke:var(--black);stroke-width:.1}
.tools-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
button{border:3px solid var(--green);background:var(--black);color:var(--green);
  min-height:56px;padding:8px 9px;font-size:18px;font-weight:900;line-height:1.15}
button:hover:not(:disabled),button:active:not(:disabled){background:var(--green);color:var(--black)}
button.primary{background:var(--green);color:var(--black)}
button.primary:hover:not(:disabled){background:var(--black);color:var(--green)}
.region-results{display:flex;flex-wrap:wrap;gap:6px;max-height:84px;overflow:hidden}
.region-results:empty{display:none}
.region-results button{min-height:34px;font-size:14px;padding:5px}
.panel-head{font-size:19px;font-weight:900;line-height:1.2;padding:8px 10px;
  background:var(--green);color:var(--black)}
.control-panel{padding:13px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px}
.form-grid{min-height:0;display:flex;flex-direction:column;gap:19px}
.field{min-width:0}
.field label{display:block;font-size:18px;line-height:1.15;font-weight:900;margin-bottom:8px}
.field input,.field select{width:100%;min-width:0;min-height:52px;background:var(--black);
  color:var(--green);border:3px solid var(--green);font-size:18px;font-weight:900;
  padding:8px 11px}
.field input{direction:ltr;text-align:left}
.field p{margin:8px 0 0;font-size:14px;font-weight:700;line-height:1.4}
.export{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;border-top:3px solid var(--green);padding-top:12px}
.export button{font-size:15px;min-height:54px;padding:7px 4px}
.console-footer{min-height:50px;border:3px solid var(--green);padding:9px 14px;
  display:flex;align-items:center;gap:12px;justify-content:space-between;font-size:16px;font-weight:900}
.status{min-width:0;line-height:1.3;overflow:hidden;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.foot-label{white-space:nowrap}
.mobile-tabs{display:none}
@media(max-width:900px){
 .terminal{padding:8px;gap:8px;grid-template-rows:auto minmax(0,1fr) auto auto}
 .topbar{min-height:59px;padding:8px 12px;border-width:2px}
 .brand h1{font-size:43px}.brand .label{font-size:12px}
 .hud{font-size:14px}
 .display{display:block;position:relative}
 .game-screen,.control-panel{width:100%;height:100%;border-width:2px}
 .game-screen{padding:8px;gap:8px;grid-template-rows:auto minmax(0,1fr) auto auto}
 .section-head{font-size:17px;padding-bottom:5px;border-width:2px}
 .section-head .right{font-size:12px}
 .playfield{border-width:2px}
 .qr-rack{width:min(calc(100% - 14px),calc(100dvh - 235px));padding:5px;border-width:3px}
 .tools-row{gap:5px}
 .tools-row button{font-size:15px;min-height:50px;padding:4px 3px;border-width:2px}
 .region-results{max-height:76px}
 .region-results button{font-size:12px}
 .control-panel{display:none;padding:12px;gap:12px}
 html[data-view="controls"] .game-screen{display:none}
 html[data-view="controls"] .control-panel{display:grid}
 .panel-head{font-size:20px}
 .form-grid{gap:15px}
 .field label{font-size:20px;margin-bottom:7px}
 .field input,.field select{font-size:19px;min-height:54px}
 .field p{font-size:15px}
 .export{gap:6px;padding-top:11px}
 .export button{font-size:15px;min-height:54px}
 .mobile-tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
 .mobile-tabs button{min-height:53px;font-size:20px;border-width:2px}
 .mobile-tabs button[aria-selected="true"]{color:var(--black);background:var(--green)}
 .console-footer{min-height:48px;padding:8px 10px;font-size:14px;border-width:2px}
 .foot-label{display:none}
}
@media(max-width:900px) and (max-height:680px){
 .terminal{padding:5px;gap:5px}
 .topbar{min-height:49px;padding:4px 9px}
 .brand h1{font-size:35px}.brand .label{font-size:11px}.hud{font-size:12px}
 .game-screen{gap:5px;padding:5px}
 .section-head{font-size:15px;min-height:21px}
 .tools-row button{min-height:45px;font-size:13px}
 .mobile-tabs button{min-height:46px;font-size:18px}
 .console-footer{min-height:39px;font-size:12px;padding:5px 7px}
 .qr-rack{width:min(calc(100% - 12px),calc(100dvh - 205px))}
 .control-panel{gap:8px;padding:8px}
 .form-grid{gap:10px}
 .field label{font-size:17px;margin-bottom:4px}
 .field input,.field select{min-height:44px;font-size:17px;padding:5px}
 .field p{font-size:13px}
 .export button{font-size:13px;min-height:44px}
}
@media(max-width:900px) and (orientation:landscape) and (max-height:520px){
 .terminal{grid-template-rows:auto minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr) 125px}
 .topbar{grid-row:1;grid-column:1/3;min-height:40px}
 .display{grid-row:2;grid-column:1}
 .mobile-tabs{grid-column:2;grid-row:2;grid-template-columns:1fr;grid-template-rows:1fr 1fr}
 .console-footer{grid-column:1/3;grid-row:3;min-height:30px}
 .game-screen{grid-template-columns:minmax(0,1fr) minmax(165px,.8fr);grid-template-rows:auto minmax(0,1fr);gap:5px}
 .game-screen .section-head{grid-row:1;grid-column:1/3}
 .playfield{grid-column:1;grid-row:2}
 .tools-row{grid-column:2;grid-row:2;grid-template-columns:1fr;align-content:center}
 .region-results{position:absolute;left:5px;right:5px;bottom:5px;background:var(--black);max-height:45px}
 .qr-rack{width:min(calc(100% - 10px),calc(100dvh - 85px))}
 .control-panel{grid-template-columns:1fr 1fr;grid-template-rows:auto minmax(0,1fr);gap:5px}
 .panel-head{grid-column:1/3;grid-row:1;font-size:16px;padding:3px 8px}
 .form-grid{grid-column:1;grid-row:2;gap:6px}
 .field label{font-size:12px;margin-bottom:2px}
 .field input,.field select{min-height:30px;font-size:13px;padding:2px}
 .field p{display:none}
 .export{grid-column:2;grid-row:2;grid-template-columns:1fr;gap:4px;align-content:center;border:0;padding:0}
 .export button{min-height:35px;font-size:12px}
}
</style>
</head>
<body>
<main class="terminal">
 <header class="topbar">
  <div class="brand"><h1>qArt</h1><div class="label">MATRIX<br>EDITOR</div></div>
  <div class="hud">SYSTEM READY ■</div>
 </header>
 <div class="display">
  <section class="game-screen" aria-label="QR matrix editor">
   <div class="section-head"><span>01 / MATRIX</span><span class="right">EDIT MODE</span></div>
   <div class="playfield"><div class="qr-rack"><div id="qr" aria-label="Editable QR code"></div></div></div>
   <div class="tools-row">
    <button id="regions" class="primary">FIND SPACE</button>
    <button id="editable">SAFE PIXELS</button>
    <button id="reset">RESET</button>
   </div>
   <div id="regionResults" class="region-results" aria-label="Erasable regions"></div>
  </section>
  <section class="control-panel" aria-label="Controls">
   <div class="panel-head">02 / CONTROLS</div>
   <div class="form-grid">
    <div class="field"><label for="data">LINK OR TEXT</label><input id="data" type="text" value="https://example.com" spellcheck="false" placeholder="https://..."></div>
    <div class="field"><label for="mask">PATTERN</label>
     <select id="mask"><option value="0">Pattern 1</option><option value="1">Pattern 2</option><option value="2">Pattern 3</option><option value="3">Pattern 4</option><option value="4">Pattern 5</option><option value="5">Pattern 6</option><option value="6">Pattern 7</option><option value="7">Pattern 8</option></select>
    </div>
    <div class="field"><label for="level">ERROR CORRECTION</label>
     <select id="level"><option value="H">High</option><option value="Q">Medium-high</option><option value="M">Medium</option><option value="L">Low</option></select>
     <p>Changing the pattern or correction level resets your drawing.</p>
    </div>
   </div>
   <div class="export">
    <button id="scan">SCAN TEST</button>
    <button id="png">PNG ↓</button>
    <button id="svg">SVG ↓</button>
   </div>
  </section>
 </div>
 <nav class="mobile-tabs" aria-label="Screens">
  <button type="button" data-tab="play" aria-selected="true">MATRIX</button>
  <button type="button" data-tab="controls" aria-selected="false">CONTROLS</button>
 </nav>
 <footer class="console-footer"><div id="status" class="status" role="status" aria-live="polite">READY</div><div class="foot-label">BLACK / GREEN ONLY</div></footer>
</main>
<script src="qr-engine.js"></script>
<script src="regions.js"></script>
<script src="app.js"></script>
<script>
(function(){
 const buttons=document.querySelectorAll('[data-tab]');
 function show(view){document.documentElement.dataset.view=view;
  buttons.forEach(button=>button.setAttribute('aria-selected',String(button.dataset.tab===view)))}
 buttons.forEach(button=>button.addEventListener('click',()=>show(button.dataset.tab)));
 show('play');
}());
</script>
<script src="lowres.js"></script>
</body>
</html>
