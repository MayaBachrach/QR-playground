<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="qArt — מסוף לעריכה יצירתית של קודי QR">
<title>qArt — מסוף QR</title>
<style>
:root{--black:#000000;--pink:#FF0088;background:var(--black);color:var(--pink);font-family:Arial,"Noto Sans Hebrew",sans-serif;font-size:18px;font-weight:700}
*{box-sizing:border-box}
html,body{margin:0;min-width:280px;min-height:100%;background:var(--black);color:var(--pink)}
button,input{font:inherit;border-radius:0;box-shadow:none}
button{cursor:pointer;background:var(--black);color:var(--pink);border:2px solid var(--pink);min-height:50px;padding:10px 14px;font-weight:800;line-height:1.25}
button:hover:not(:disabled),button[aria-pressed="true"],button.primary{background:var(--pink);color:var(--black)}
button.primary:hover:not(:disabled){background:var(--black);color:var(--pink)}
button:disabled{cursor:wait;border-style:dashed}
:focus-visible{outline:3px solid var(--pink);outline-offset:4px}
.terminal{min-height:100dvh;max-width:1600px;margin:auto;padding:clamp(10px,2vw,28px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:16px}
.topbar{border:3px solid var(--pink);display:flex;justify-content:space-between;align-items:center;gap:15px;padding:12px 20px}
.brand{display:flex;align-items:baseline;gap:18px;min-width:0}
.brand h1{font:bold clamp(42px,5vw,72px)/1 "Courier New",monospace;letter-spacing:-3px;margin:0;direction:ltr}
.brand span{font-size:clamp(19px,2vw,28px)}
.terminal-id{font:bold clamp(14px,1.4vw,20px)/1.3 "Courier New",monospace;direction:ltr;white-space:nowrap}
.workspace{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.85fr);gap:16px;min-height:0}
.screen,.controls{border:3px solid var(--pink);padding:clamp(12px,1.5vw,22px);min-width:0}
.screen{display:flex;flex-direction:column;gap:15px;min-height:530px}
.screen-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:clamp(17px,1.8vw,24px)}
.position{font-family:"Courier New",monospace;direction:ltr;font-size:clamp(16px,1.5vw,20px)}
.qr-well{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border:2px solid var(--pink);padding:12px}
#qr{width:min(100%,68dvh,650px);aspect-ratio:1;display:grid;place-items:center;outline-offset:6px}
#qr svg{width:100%;height:100%;display:block;shape-rendering:crispEdges;image-rendering:pixelated;pointer-events:none}
.instructions{font-size:clamp(16px,1.5vw,21px);line-height:1.4;text-align:center}
.controls{display:flex;flex-direction:column;gap:18px}
.group{display:flex;flex-direction:column;gap:10px}
.group-title{font-size:clamp(20px,2vw,27px);font-weight:900;border-bottom:2px solid var(--pink);padding-bottom:7px}
.field-label{display:block;font-size:clamp(18px,1.6vw,22px);margin-bottom:8px}
#data{width:100%;min-height:58px;padding:9px 12px;background:var(--black);color:var(--pink);border:2px solid var(--pink);direction:ltr;text-align:left;font-family:"Courier New",monospace;font-size:clamp(17px,1.7vw,22px)}
#data::placeholder{color:var(--pink)}
.dpad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,49px);gap:5px;max-width:330px;margin:auto;width:100%;direction:ltr}
.dpad button{min-height:0;padding:3px;font-size:27px}
.dpad .pad-up{grid-column:2;grid-row:1}
.dpad .pad-left{grid-column:1;grid-row:2}
.dpad .pad-edit{grid-column:2;grid-row:2;font-size:16px;line-height:1.05}
.dpad .pad-right{grid-column:3;grid-row:2}
.dpad .pad-down{grid-column:2;grid-row:3}
.region-results{display:grid;grid-template-columns:1fr;gap:7px}
.region-results:empty{display:none}
.region-results button{text-align:right;min-height:47px}
.erase-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.export{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.output{margin-top:auto}
.footer{border-top:3px solid var(--pink);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 5px;font-size:clamp(16px,1.5vw,22px)}
#status{line-height:1.35;overflow-wrap:anywhere}
.footer-mark{font:bold 17px "Courier New",monospace;white-space:nowrap;direction:ltr}
@media(max-width:920px){
 .terminal{display:flex;flex-direction:column;gap:10px;padding:9px}
 .topbar{padding:10px 12px;border-width:2px}
 .brand{gap:10px}.brand h1{font-size:44px}.brand span{font-size:18px}
 .terminal-id{font-size:12px}
 .workspace{display:flex;flex-direction:column;gap:10px}
 .screen,.controls{border-width:2px;padding:12px}
 .screen{min-height:0;gap:10px}
 .qr-well{padding:7px}
 #qr{width:min(100%,65dvh,560px)}
 .controls{gap:17px}
 .footer{border-width:2px}
 .footer-mark{display:none}
}
@media(max-width:400px){
 .terminal-id{display:none}
 .brand span{font-size:17px}
 .erase-actions{grid-template-columns:1fr}
 .dpad{grid-template-rows:repeat(3,46px)}
}
@media(min-width:921px) and (max-height:720px){
 .terminal{gap:9px;padding:9px}
 .topbar{padding:6px 14px}
 .brand h1{font-size:45px}
 .workspace{gap:9px}
 .screen,.controls{padding:10px}
 .screen{min-height:0}
 .controls{gap:10px}
 .group{gap:6px}
 .dpad{grid-template-rows:repeat(3,40px)}
 .footer{padding:7px 3px}
}
</style>
</head>
<body>
<main class="terminal">
 <header class="topbar">
  <div class="brand"><h1>qArt</h1><span>מסוף לעריכת QR</span></div>
  <div class="terminal-id">TERMINAL / 1955</div>
 </header>
 <div class="workspace">
  <section class="screen" aria-label="קוד QR">
   <div class="screen-head"><strong>מטריצת עריכה</strong><span id="position" class="position">X: 01 / Y: 01</span></div>
   <div class="qr-well"><div id="qr" tabindex="0" role="img" aria-label="קוד QR. השתמשו בחצים לתנועה וברווח לסימון או לביטול סימון"></div></div>
   <div class="instructions">חצים לתנועה · רווח לסימון או לביטול סימון</div>
  </section>
  <section class="controls" aria-label="לוח בקרה">
   <div class="group">
    <div class="group-title">01 / יצירת קוד</div>
    <label class="field-label" for="data">קישור או טקסט</label>
    <input id="data" type="text" value="https://example.com" placeholder="https://..." spellcheck="false" autocomplete="off">
   </div>
   <div class="group">
    <div class="group-title">02 / עריכת משבצות</div>
    <div class="dpad" role="group" aria-label="שליטה במשבצות">
     <button id="move-up" class="pad-up" type="button" aria-label="למעלה">↑</button>
     <button id="move-left" class="pad-left" type="button" aria-label="שמאלה">←</button>
     <button id="draw" class="pad-edit primary" type="button">סמן / בטל</button>
     <button id="move-right" class="pad-right" type="button" aria-label="ימינה">→</button>
     <button id="move-down" class="pad-down" type="button" aria-label="למטה">↓</button>
    </div>
   </div>
   <div class="group">
    <div class="group-title">03 / מחיקת שטחים</div>
    <button id="regions" type="button" class="primary">חפש אזורים למחיקה</button>
    <div id="regionResults" class="region-results" aria-label="אזורים שאפשר למחוק"></div>
    <div class="erase-actions">
     <button id="erase" type="button" disabled>מחק אזור נבחר</button>
     <button id="reset" type="button">איפוס שינויים</button>
    </div>
   </div>
   <div class="group output">
    <div class="group-title">04 / שמירת קוד</div>
    <div class="export">
     <button id="png" type="button">הורדת PNG</button>
     <button id="svg" type="button">הורדת SVG</button>
    </div>
   </div>
  </section>
 </div>
 <footer class="footer">
  <div id="status" role="status" aria-live="polite">המסוף מוכן</div>
  <span class="footer-mark">QR / READY</span>
 </footer>
</main>
<script src="qr-engine.js"></script>
<script src="regions.js"></script>
<script src="app.js"></script>
</body>
</html>
